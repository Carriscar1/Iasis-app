<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IASIS — Apresentação do app</title>
<link rel="icon" href="/favicon.ico">
<style>
  /* Página de apresentação: o app de verdade (mesmo endereço) dentro de um
     celular na tela, ampliado para caber no monitor sem perder nitidez. */
  :root {
    --bg-1: #0f1c32;
    --bg-2: #1c2b4b;
    --text: #eef4fd;
    --muted: #aebfdc;
    --green: #1d9e75;
    --line: rgba(255, 255, 255, .12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 700px at 70% 30%, #2a4372 0%, transparent 60%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .stage { height: 100%; display: flex; align-items: center; justify-content: center; gap: 72px; padding: 24px; }

  /* Painel lateral (some em telas estreitas) */
  .side { width: 340px; display: flex; flex-direction: column; gap: 22px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand h1 { margin: 0; font-size: 44px; letter-spacing: -1.5px; font-weight: 800; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .lead { color: var(--muted); font-size: 16px; line-height: 1.55; margin: 0; }
  .group { display: flex; flex-direction: column; gap: 10px; }
  .group span { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .btn {
    appearance: none; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--text);
    border-radius: 14px; padding: 13px 16px; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 10px; transition: background .15s, border-color .15s;
  }
  .btn:hover { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .25); }
  .btn.primary { background: var(--green); border-color: var(--green); }
  .btn.primary:hover { background: #22b386; }
  .keys { font-size: 13px; color: var(--muted); line-height: 1.7; }
  kbd { background: rgba(255, 255, 255, .1); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-family: inherit; font-size: 12px; color: var(--text); }

  /* Celular: a tela tem 390 x 844 pontos, como um Android/iPhone comum.
     O tamanho real na tela vem do "zoom" calculado no script — o zoom
     redesenha o conteúdo maior em vez de esticar uma imagem, por isso fica nítido. */
  .phone {
    width: 418px; height: 872px; padding: 14px; border-radius: 62px; position: relative; flex: none;
    background: linear-gradient(145deg, #2b2f36, #0b0d10);
    box-shadow: 0 0 0 2px #3a3f47, 0 40px 90px rgba(0, 0, 0, .55), inset 0 0 0 2px #000;
  }
  .screen { width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: #1c2b4b; position: relative; }
  .status {
    height: 44px; background: #1c2b4b; color: #fff; display: flex; align-items: center; justify-content: space-between;
    padding: 0 30px 0 34px; font-size: 15px; font-weight: 600; position: relative; z-index: 2;
  }
  .island { position: absolute; left: 50%; top: 11px; width: 108px; height: 30px; transform: translateX(-50%); background: #000; border-radius: 20px; z-index: 3; }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  iframe { display: block; width: 390px; height: 800px; border: 0; background: #1c2b4b; }
  .btn-side { position: absolute; right: -4px; width: 4px; border-radius: 0 3px 3px 0; background: #2b2f36; }

  @media (max-width: 900px) { .side { display: none; } }
</style>
</head>
<body>
<div class="stage">
  <aside class="side">
    <div class="brand">
      <svg width="64" height="62" viewBox="0 0 120 116" aria-hidden="true">
        <defs><linearGradient id="h" x1="60" y1="12" x2="60" y2="104" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#AFD0EE"/><stop offset="1" stop-color="#5B93CF"/></linearGradient></defs>
        <path d="M60 102C26 76 12 57 12 39 12 25 23 15 35 15 45 15 54 21 60 31 66 21 75 15 85 15 97 15 108 25 108 39 108 57 94 76 60 102Z" fill="url(#h)"/>
        <path d="M27 60H49l5-11 7 24 8-31 6 18h13" stroke="#101d33" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div><h1>Iasis</h1><p>Sua saúde em dia</p></div>
    </div>
    <p class="lead">O aplicativo de verdade, rodando ao vivo. Use o mouse como se fosse o dedo: clique para tocar e use a rodinha para rolar.</p>
    <div class="group">
      <span>Entrar sem conta</span>
      <button class="btn primary" data-demo="patient">Ver como paciente</button>
      <button class="btn" data-demo="caregiver">Ver como cuidador</button>
      <button class="btn" data-demo="">Voltar para o login</button>
    </div>
    <div class="group">
      <span>Tela</span>
      <button class="btn" id="fs">Tela cheia</button>
    </div>
    <div class="keys"><kbd>F</kbd> tela cheia &nbsp; <kbd>P</kbd> paciente &nbsp; <kbd>C</kbd> cuidador &nbsp; <kbd>L</kbd> login</div>
  </aside>

  <div class="phone" id="phone">
    <span class="btn-side" style="top:170px;height:64px"></span>
    <span class="btn-side" style="top:250px;height:64px"></span>
    <div class="screen">
      <div class="island"></div>
      <div class="status">
        <span id="clock">9:41</span>
        <span class="icons" aria-hidden="true">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0zM3.4 6.8a6.5 6.5 0 0 1 9.2 0l-1.4 1.4a4.5 4.5 0 0 0-6.4 0zM1.2 4.6a9.6 9.6 0 0 1 13.6 0l-1.4 1.4a7.6 7.6 0 0 0-10.8 0z" fill="#fff"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="17" height="8" rx="2" fill="#fff"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="#fff" opacity=".5"/></svg>
        </span>
      </div>
      <iframe id="app" src="/" title="Aplicativo IASIS"></iframe>
    </div>
  </div>
</div>

<script>
  const phone = document.getElementById('phone');
  const app = document.getElementById('app');

  // Ajusta o celular para ocupar a altura da tela (com folga).
  function fit() {
    const zoom = Math.min((innerHeight - 48) / 872, (innerWidth - 48) / 418, 2.4);
    phone.style.zoom = zoom.toFixed(3);
  }
  addEventListener('resize', fit);
  fit();

  // Relógio da barra de status.
  function tick() {
    const d = new Date();
    document.getElementById('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick(); setInterval(tick, 10000);

  // Esconde as barras de rolagem dentro do app (no celular elas não aparecem).
  app.addEventListener('load', () => {
    try {
      const s = app.contentDocument.createElement('style');
      s.textContent = '*::-webkit-scrollbar{display:none!important}*{scrollbar-width:none!important}';
      app.contentDocument.head.appendChild(s);
    } catch (e) { /* outra origem: ignora */ }
  });

  // Demonstração: o app guarda o papel da demo no armazenamento do navegador
  // (mesmo endereço desta página). Gravar e recarregar abre direto na tela.
  function demo(role) {
    try {
      if (role) localStorage.setItem('iasis:demo-role', role);
      else localStorage.removeItem('iasis:demo-role');
    } catch (e) {}
    app.src = '/?t=' + Date.now();
  }
  document.querySelectorAll('[data-demo]').forEach((b) => b.addEventListener('click', () => demo(b.dataset.demo)));

  function fullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }
  document.getElementById('fs').addEventListener('click', fullscreen);

  // Atalhos de teclado (só quando o foco está fora do app).
  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'f') fullscreen();
    if (k === 'p') demo('patient');
    if (k === 'c') demo('caregiver');
    if (k === 'l') demo('');
  });
</script>
</body>
</html>
